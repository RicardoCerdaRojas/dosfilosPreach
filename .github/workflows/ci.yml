name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  lint-and-type-check:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        # --ignore-engines because @dosfilos/functions pins node to "20"
        # exact and dev environments often run newer; matches the
        # leniency npm had before the migration.
        run: yarn install --frozen-lockfile --ignore-engines

      - name: Run linter
        run: npm run lint
      
      - name: Type check
        run: npm run type-check
        continue-on-error: true  # Allow legacy TypeScript errors

      # `packages/web` quedaba fuera de TODO chequeo de tipos: su tsconfig.json
      # es un archivo-solución con `"files": []`, así que `tsc --noEmit` no
      # miraba ni un archivo y `vite build` tampoco typechequea. El compilador
      # venía reportando el crash de `ExegesisPaperPage` (PR #436) desde #296,
      # en la línea exacta, sin que nadie pudiera leerlo.
      #
      # Este paso NO es continue-on-error a propósito: los ~574 errores
      # preexistentes están congelados en el baseline y no bloquean, pero un
      # error NUEVO sí. Es la única forma de que el trinquete apriete.
      - name: Web type-check ratchet
        run: ./scripts/check-web-types.sh

      # El audit de compliance completo NO puede correr en CI: arrastra 67
      # violaciones duras preexistentes (long tail de tamaño de archivo). Esta
      # regla sí tiene que bloquear, así que corre sola. La clave de Gemini vivió
      # meses en el bundle y resultó ser la MISMA credencial del backend; el SDK
      # no necesita la clave para volver a entrar, alcanza con que algo del grafo
      # del navegador lo importe.
      - name: SDK de Gemini fuera del navegador
        run: ./scripts/check-gemini-sdk-boundary.sh

      # REGLA DEL FUNDADOR (2026-08-23): en cada tarea —crear O refactorizar— el
      # texto de cara al usuario va por i18n, exista o no traducción previa en
      # ese archivo. "El archivo ya estaba hardcodeado" dejó de ser excusa.
      #
      # El chequeo de i18n que había sólo prohibía `defaultValue:` — vigilaba a
      # quien ya usaba `t()` y hacía trampa, y no miraba a quien no lo usaba en
      # absoluto. Así quedaron 141 archivos con español incrustado, invisibles.
      #
      # `react-hooks/rules-of-hooks` estaba en 'off' en el .eslintrc de web: el
      # plugin instalado, la config extendiéndolo, y apagada justo la regla que
      # atrapa el error que rompe la pantalla en runtime. Costó un crash de
      # `StepDraft` al regenerar (un `useMemo` bajo un `if (loading) return`).
      # Trinquete por archivo: la deuda vieja no bloquea, una nueva sí.
      - name: Trinquete de react-hooks (hooks condicionales)
        run: ./scripts/check-react-hooks.sh

      # Trinquete, no cero: las 588 ocurrencias preexistentes no bloquean; una
      # nueva sí.
      - name: Trinquete de i18n (texto hardcodeado)
        run: ./scripts/check-i18n-hardcoded.sh

      # Los correos de producción estuvieron caídos sin que nadie lo notara:
      # ninguna función declaraba `secrets: ['RESEND_API_KEY']`, la clave
      # dependía de `packages/functions/.env`, y CI despliega sin ese archivo.
      #
      # El diseño obvio —un health-check en runtime— NO lo habría atrapado: esa
      # función declara los secretos que revisa, así que siempre los tiene.
      # Reportaría verde con trece funciones sin clave.
      #
      # Esto es calculable, así que se calcula y bloquea ANTES del deploy.
      - name: Secretos declarados por function
        run: ./scripts/check-functions-secrets.sh

  mobile:
    name: Mobile (typecheck + lint + bundle)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-engines

      - name: Type check
        working-directory: packages/mobile
        run: npx tsc --noEmit -p tsconfig.json

      - name: Lint
        working-directory: packages/mobile
        run: npx expo lint

      # El bundle de Metro atrapa lo que tsc no ve: imports rotos en runtime,
      # assets faltantes, config de Metro inválida. No necesita SDKs nativos.
      - name: Metro bundle (android)
        working-directory: packages/mobile
        run: npx expo export --platform android --output-dir /tmp/expo-export
        env:
          CI: 'true'

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        # --ignore-engines because @dosfilos/functions pins node to "20"
        # exact and dev environments often run newer; matches the
        # leniency npm had before the migration.
        run: yarn install --frozen-lockfile --ignore-engines
      
      # Cada paquete con SU config: desde la raíz, `packages/web` no toma su
      # entorno jsdom y sus tests fallan en falso. Ese falso rojo es lo que
      # justificaba el `continue-on-error`, que a su vez hacía que este paso
      # reportara verde pase lo que pase — y se tragaba las fallas reales.
      - name: Run unit tests
        run: npm run test:unit

  firestore-rules:
    name: Reglas de Firestore
    runs-on: ubuntu-latest

    # Las reglas eran el único archivo desplegable del repo SIN una sola prueba.
    # El 2026-08-23 el PR #454 hizo que `create()` leyera el documento antes de
    # escribirlo y no tocó `firestore.rules`, donde `allow get` desreferenciaba
    # `resource.data` sin contemplar el documento ausente. Sobre un documento que
    # no existe Firestore responde permission-denied, así que la regla prohibía
    # leer lo que aún no existía y el estudio del pastor no se podía crear.
    # Estuvo roto tres semanas y lo encontró un usuario, no el pipeline: un
    # desajuste entre una lectura nueva del cliente y las reglas era indetectable.
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      # El emulador de Firestore es un binario Java. Sin JDK no arranca, y el
      # síntoma es un timeout del emulador — no un "falta Java" legible.
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-engines

      - name: Reglas contra el emulador
        run: yarn test:rules

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-and-type-check, test, firestore-rules]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        # --ignore-engines because @dosfilos/functions pins node to "20"
        # exact and dev environments often run newer; matches the
        # leniency npm had before the migration.
        run: yarn install --frozen-lockfile --ignore-engines

      - name: Build web app
        run: npm run build

      # La landing (Astro) se instala + construye DESPUÉS del web: sus deps (npm,
      # fuera de yarn.lock) no deben contaminar node_modules antes del build del
      # web. El root `npm run build` no toca la landing (su script es build:site).
      - name: Install + build landing (Astro)
        run: |
          npm install --prefix packages/landing --no-workspaces --no-audit --no-fund
          npm run build:site --prefix packages/landing

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: packages/web/dist
          retention-days: 7
