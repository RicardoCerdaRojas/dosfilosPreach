name: Deploy Production

on:
  push:
    branches:
      - main
  # DISPARO MANUAL, porque el evento de push SE PIERDE. El 26/08/2026 GitHub
  # Actions tuvo un `major_outage`: el merge a main entró, el push no creó
  # ninguna corrida, y producción quedó sin el deploy de un PR ya mergeado —
  # sin forma de lanzarlo salvo empujar un commit vacío a la rama por defecto.
  # Un deploy que sólo sabe dispararse solo no se puede rescatar cuando el
  # disparador falla.
  workflow_dispatch:
    inputs:
      reason:
        description: 'Por qué se lanza a mano (ej.: outage de Actions, deploy perdido)'
        required: false
        default: 'redeploy manual'

jobs:
  deploy-production:
    name: Deploy to Firebase Production
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://preach.dosfilos.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-engines

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # Build del web PRIMERO, con node_modules limpio. El root `npm run build`
      # NO toca la landing (su script es build:site, no build).
      - name: Build web app
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_GEMINI_MODEL_ID: "gemini-2.5-flash"
          VITE_RECAPTCHA_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_SITE_KEY }}

      # La landing se instala + construye DESPUÉS del web (deps npm fuera de
      # yarn.lock; no deben contaminar node_modules antes del build del web).
      # Ver docs/Preach_SEO_descubribilidad.md §8.1.
      - name: Install + build landing (Astro)
        run: |
          npm install --prefix packages/landing --no-workspaces --no-audit --no-fund
          npm run build:site --prefix packages/landing

      # Mapear los targets de hosting a sus sitios (.firebaserc está gitignored,
      # así que se aplican en el runner). El sitio `dosfilos-preach-marketing`
      # debe existir en el proyecto (paso de consola del fundador) ANTES del
      # primer deploy, o este paso/deploy falla por sitio inexistente.
      - name: Configure Hosting targets
        run: |
          firebase target:apply hosting app dosfilosapp --project ${{ secrets.FIREBASE_PROJECT_ID }}
          firebase target:apply hosting marketing dosfilos-preach-marketing --project ${{ secrets.FIREBASE_PROJECT_ID }}
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      # Deploy multi-site (CLI). Reemplaza action-hosting-deploy (single-site).
      - name: Deploy Hosting (app + marketing)
        run: firebase deploy --only hosting --project ${{ secrets.FIREBASE_PROJECT_ID }}
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      # Reintenta el despliegue de funciones hasta tres veces.
      #
      # POR QUÉ SÓLO ESTE PASO. El fallo observado es «Failed to list
      # functions», que ocurre ANTES de desplegar nada: el CLI pide a Google la
      # lista de funciones existentes para diferenciar qué cambió, y esa
      # llamada falla sola de vez en cuando. Pasó en el despliegue de #672 y el
      # push siguiente, con el mismo código y el mismo proyecto, funcionó; ya
      # había pasado igual en el #501. Los otros pasos del workflow no han
      # mostrado esta falla, y poner reintentos donde no hay un fallo medido
      # esconde los reales.
      #
      # `firebase deploy --only functions` es idempotente —compara y actualiza
      # lo que cambió— así que reintentar un despliegue a medio aplicar es
      # seguro.
      #
      # Un fallo de verdad sigue tumbando el job: tres intentos y se rinde.
      - name: Deploy Firebase Functions
        run: |
          for intento in 1 2 3; do
            if firebase deploy --only functions --project ${{ secrets.FIREBASE_PROJECT_ID }}; then
              exit 0
            fi
            if [ "$intento" -lt 3 ]; then
              echo "::warning::El despliegue de funciones falló (intento $intento de 3). Reintentando en 30 s."
              sleep 30
            fi
          done
          echo "::error::El despliegue de funciones falló tres veces seguidas. No es el fallo transitorio de listado."
          exit 1
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      # Auto-deploy Firestore rules + indexes whenever they change. Local
      # `firestore.indexes.json` was reconciled with production via
      # `firebase firestore:indexes` before this step was added — so the
      # union of remote-only + local-only indexes is preserved. Going
      # forward, ALL index changes must go through the local file (no more
      # creating indexes via Firebase Console) or this step will delete
      # them on the next deploy.
      - name: Deploy Firestore rules + indexes
        run: firebase deploy --only firestore:rules,firestore:indexes --project ${{ secrets.FIREBASE_PROJECT_ID }}
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      # Auto-deploy Storage rules whenever `storage.rules` changes. Was
      # missing from this workflow originally — local edits to the file
      # never reached production until someone ran a manual deploy. Caught
      # in May 2026 when the library upload cap bump (100MB → 250MB) sat
      # in the repo with no path to prod.
      - name: Deploy Storage rules
        run: firebase deploy --only storage --project ${{ secrets.FIREBASE_PROJECT_ID }}
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
